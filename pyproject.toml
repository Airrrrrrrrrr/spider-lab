[project]
name = "spider-lab"
version = "0.1.0"
description = "现代爬虫逆向工程化与 AI 数据架构进阶实验室（独立 Python 3.12 环境，与全局 Python 3.6.8 严格物理隔离）"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx[http2]>=0.27.0",
    "curl-cffi>=0.7.0",
    "pydantic>=2.9.0",
    "loguru>=0.7.2",
    "parsel>=1.9.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spider_lab"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/spider_lab/__init__.py" = ["UP036"]
"scripts/verify_isolation.py" = ["UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
